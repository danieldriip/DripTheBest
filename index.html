<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drip</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --neon-green: #39ff14;
            --neon-green-soft: #00ff88;
            --neon-green-dark: #0a8a1a;
            --dark-bg: #050a05;
            --card-bg: rgba(8, 18, 10, 0.92);
            --border-green: rgba(57, 255, 20, 0.25);
            --border-green-soft: rgba(57, 255, 20, 0.12);
        }
        html, body { background: var(--dark-bg); }
        body {
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            color: #c8ffd4;
            overflow-x: hidden;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        header { text-align: center; padding: 6px 0 4px; }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);
        }
        .subtitle {
            font-size: 0.7rem;
            color: rgba(200, 255, 212, 0.5);
            margin-top: 2px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border-green-soft);
        }
        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-green);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--neon-green);
            border-radius: 50%;
        }
        .row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .row:last-child { margin-bottom: 0; }
        .row > * { flex: 1; min-width: 0; }
        .row > label { flex: 0 0 auto; }
        .row .btn { flex: 0 0 auto; }
        label {
            color: rgba(200, 255, 212, 0.8);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        input[type="text"], input[type="number"], select {
            background: rgba(0, 15, 5, 0.7);
            border: 1px solid var(--border-green-soft);
            border-radius: 5px;
            padding: 5px 8px;
            color: #e8ffe8;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            height: 28px;
            outline: none;
        }
        input[type="text"], input[type="number"] { width: 100%; }
        input[type="number"] { color: var(--neon-green-soft); text-align: center; max-width: 80px; }
        input:focus, select:focus { border-color: var(--neon-green); }
        input[type="checkbox"] {
            appearance: none;
            width: 16px; height: 16px;
            background: rgba(0, 15, 5, 0.8);
            border: 1px solid var(--border-green);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin: 0;
        }
        input[type="checkbox"]:checked {
            background: var(--neon-green);
            border-color: var(--neon-green);
        }
        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #03100a;
            font-weight: 900;
            font-size: 11px;
            line-height: 1;
        }
        textarea {
            width: 100%;
            background: rgba(0, 15, 5, 0.7);
            border: 1px solid var(--border-green-soft);
            border-radius: 5px;
            padding: 6px 8px;
            color: var(--neon-green);
            font-family: 'Rajdhani', monospace;
            font-size: 0.8rem;
            resize: vertical;
            min-height: 50px;
            outline: none;
        }
        .btn {
            font-family: 'Orbitron', sans-serif;
            padding: 6px 14px;
            border: 1px solid;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            height: 28px;
            line-height: 1;
        }
        .btn-primary {
            background: var(--neon-green);
            color: #03100a;
            border-color: var(--neon-green);
        }
        .btn-primary:hover { background: var(--neon-green-soft); }
        .btn-secondary {
            background: transparent;
            color: var(--neon-green);
            border-color: var(--neon-green);
        }
        .btn-secondary:hover { background: rgba(57, 255, 20, 0.15); }
        .btn-danger {
            background: transparent;
            color: #ff6b6b;
            border-color: #ff4757;
        }
        .btn-danger:hover { background: rgba(255, 71, 87, 0.15); }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background: rgba(0, 15, 5, 0.6);
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ff4757;
        }
        .status-dot.connected { background: var(--neon-green); }
        .lang-badge {
            display: inline-block;
            padding: 1px 6px;
            background: rgba(57, 255, 20, 0.15);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            font-size: 0.65rem;
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
        }
        .info-line {
            font-size: 0.72rem;
            color: var(--neon-green-soft);
            padding: 2px 0;
        }
        .field-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
        .field-group > label { font-size: 0.7rem; color: rgba(200, 255, 212, 0.5); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">Drip</h1>
            <p class="subtitle">Automation Tool</p>
        </header>

        <div class="card">
            <div class="card-title">Control</div>
            <div class="row">
                <span class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">Disconnected</span></span>
                <button class="btn btn-primary" id="btn-connect">Connect</button>
                <button class="btn btn-danger" id="btn-disconnect">Disconnect</button>
            </div>
            <div class="row">
                <div class="field-group"><label>Device</label>
                    <select id="devtype">
                        <option value="350">Android</option>
                        <option value="345">iOS</option>
                        <option value="352">Web</option>
                    </select>
                </div>
                <div class="field-group"><label>RC</label><input type="text" id="rc" maxlength="10" placeholder="code"></div>
                <span class="lang-badge" id="autoLangBadge">AUTO</span>
                <span class="info-line" id="detectedLang"></span>
            </div>
            <div class="row">
                <div class="field-group" style="flex:2"><label>Planet</label><input type="text" id="planet" placeholder="planet"></div>
                <div class="field-group" style="flex:2"><label>Escape →</label><input type="text" id="planet2" placeholder="rejoin planet"></div>
            </div>
            <div class="row">
                <button class="btn btn-secondary" id="plntgo">Fly</button>
                <button class="btn btn-danger" id="escape">Escape Prison</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Toggles</div>
            <div class="row">
                <label><input type="checkbox" id="green" checked> Normal</label>
                <label><input type="checkbox" id="autoescape" checked> Auto Escape</label>
                <label><input type="checkbox" id="copykick"> Copy Kick</label>
                <label><input type="checkbox" id="moves"> Move</label>
                <label><input type="checkbox" id="accion"> Action</label>
                <label><input type="checkbox" id="secs"> Wait 3s</label>
            </div>
            <div class="row">
                <label><input type="checkbox" id="Ran" checked> Random</label>
                <label><input type="checkbox" id="reverse"> Reverse</label>
                <label><input type="checkbox" id="sleep"> Sleep (WS)</label>
                <label><input type="checkbox" id="timeshifter"> Auto Shift</label>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Timing (ms)</div>
            <div class="row">
                <div class="field-group"><label>Wait</label><input type="number" id="waiting" value="1880"></div>
                <div class="field-group"><label>Attack</label><input type="number" id="attack" value="1880"></div>
                <div class="field-group"><label>+Inc</label><input type="number" id="increment" value="5"></div>
                <div class="field-group"><label>-Dec</label><input type="number" id="decrement" value="5"></div>
                <div class="field-group"><label>Reconnect</label><input type="number" id="reconnect" value="200" min="500" max="10000"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Lists</div>
            <div class="row">
                <div class="field-group" style="flex:1"><label>W-Clan</label><textarea id="whitelist3" rows="2" placeholder="WHITECLAN"></textarea></div>
                <div class="field-group" style="flex:1"><label>B-Clan</label><textarea id="whitelist" rows="2" placeholder="BLACKCLAN"></textarea></div>
                <div class="field-group" style="flex:1"><label>W-Nick</label><textarea id="whitelist2" rows="2" placeholder="nick1..."></textarea></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Manual</div>
            <div class="row">
                <div class="field-group" style="flex:1"><label>Jump Position</label><input type="number" id="position" placeholder="0"></div>
            </div>
            <div class="row">
                <div class="field-group" style="flex:1"><label>Log</label><textarea id="sec" rows="3" placeholder="connection log..."></textarea>
                    <div id="sec4" style="display:none"></div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Chat</div>
            <div class="row">
                <div class="field-group" style="flex:1">
                    <label>Game Chat Log</label>
                    <textarea id="chatLog" rows="6" readonly placeholder="JOIN / PART / chat messages..." style="min-height:120px"></textarea>
                </div>
            </div>
            <div class="row">
                <div class="field-group" style="flex:3">
                    <label>Message</label>
                    <input type="text" id="chatInput" placeholder="Mensaje para el chat del juego...">
                </div>
                <button class="btn btn-primary" id="chatSend">Send</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Movement Cheat</div>
            <div class="row">
                <label><input type="checkbox" id="moves" checked> Auto-Move (left ↔ right click)</label>
            </div>
            <div class="row">
                <div class="field-group"><label>Interval (ms)</label><input type="number" id="moveInterval" value="800" min="100" max="5000"></div>
                <div class="field-group"><label>Pattern</label>
                    <select id="movePattern">
                        <option value="leftright">← → (izq / der)</option>
                        <option value="rightleft">→ ← (der / izq)</option>
                        <option value="leftonly">← only</option>
                        <option value="rightonly">→ only</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <span class="info-line" id="moveStatus">off</span>
            </div>
        </div>
    </div>

    <script>
    
 function normalizeListValue(value) {
    return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
}

const attackTimers = new Map();
const defenceTimers = new Map();

const actionQueue = [];
const queuedActionKeys = new Set();
const activeCycleKeys = new Set();

let currentAction = null;
let processingAction = false;
let reconnectingAfterAction = false;
let processNextAction = function () {};

let vaiAttack = null;
let vaiDefence = null;

let test = [];
let testt = [];

function cycleKey(origem, userId) {
    return `${String(origem || '').toUpperCase()}:${String(userId || '').trim()}`;
}

function extrairIdDoPart(snippets, rawData) {

    const idDireto = String(snippets?.[1] || "")
        .replace(/\r?\n/g, "")
        .replace(/^[:@+]+|[:@+]+$/g, "")
        .trim();

    if (/^\d{8}$/.test(idDireto)) {
        return idDireto;
    }


    const tokens = String(rawData || "")
        .replace(/[:@+]/g, " ")
        .trim()
        .split(/\s+/);

    const partIndex = tokens.findIndex(
        token => String(token).toUpperCase() === "PART"
    );

    if (partIndex !== -1) {
        const proximo = String(tokens[partIndex + 1] || "").trim();
        if (/^\d{8}$/.test(proximo)) return proximo;
    }

    return "";
}

function resetarCiclos(motivo = "reset") {
    for (const timer of attackTimers.values()) clearTimeout(timer);
    for (const timer of defenceTimers.values()) clearTimeout(timer);

    attackTimers.clear();
    defenceTimers.clear();

    clearTimeout(vaiAttack);
    clearTimeout(vaiDefence);
    vaiAttack = null;
    vaiDefence = null;

    actionQueue.length = 0;
    queuedActionKeys.clear();
    activeCycleKeys.clear();

    currentAction = null;
    processingAction = false;
    reconnectingAfterAction = false;

    test.length = 0;
    testt.length = 0;

    console.log("Todos os ciclos foram zerados:", motivo);
}

function limparCiclosDoUsuario(userId, motivo = "PART") {
    const idLimpo = String(userId || "").trim();
    if (!/^\d{8}$/.test(idLimpo)) return;

    const attackTimer = attackTimers.get(idLimpo);
    if (attackTimer) clearTimeout(attackTimer);
    attackTimers.delete(idLimpo);

    const defenceTimer = defenceTimers.get(idLimpo);
    if (defenceTimer) clearTimeout(defenceTimer);
    defenceTimers.delete(idLimpo);

    const attackKey = cycleKey("353", idLimpo);
    const defenceKey = cycleKey("JOIN", idLimpo);

    activeCycleKeys.delete(attackKey);
    activeCycleKeys.delete(defenceKey);
    queuedActionKeys.delete(attackKey);
    queuedActionKeys.delete(defenceKey);

    for (let i = actionQueue.length - 1; i >= 0; i--) {
        if (String(actionQueue[i]?.id) === idLimpo) actionQueue.splice(i, 1);
    }

    test = test.filter(usuario => String(usuario.id) !== idLimpo);
    testt = testt.filter(usuario => String(usuario.id) !== idLimpo);


    if (String(currentAction?.id) === idLimpo && !reconnectingAfterAction) {
        currentAction = null;
        processingAction = false;
        setTimeout(() => processNextAction(), 0);
    }

    console.log(`${motivo}: ciclos 353 e JOIN removidos para`, idLimpo);
}

function clanInList(clan, list) {
    if (!Array.isArray(list)) {
        return false;
    }

    const normalizedClan =
        normalizeListValue(clan);

    return list.some(
        item =>
            normalizeListValue(item) ===
            normalizedClan
    );
}

function valueInList(value, list) {
    if (!Array.isArray(list)) {
        return false;
    }

    const normalizedValue =
        normalizeListValue(value);

    return list.some(
        item =>
            normalizeListValue(item) ===
            normalizedValue
    );
}

function verificador(list, userId) {
    if (!Array.isArray(list)) {
        return false;
    }

    return list.some(
        user =>
            String(user.id) ===
            String(userId)
    );
}
        (function () {
            const navLang = (navigator.language || 'en').toLowerCase();
            const isPtBr = navLang.startsWith('pt');
            const badge = document.getElementById('autoLangBadge');
            const info = document.getElementById('detectedLang');
            const autoescape = document.getElementById('autoescape');
            if (isPtBr) {
                badge.textContent = 'PT-BR';
                if (autoescape && !autoescape.checked) autoescape.checked = true;
                if (info) info.textContent = 'PT/BR ✓ escape auto';
            } else {
                badge.textContent = navLang.toUpperCase();
                if (info) info.textContent = navLang + ' — auto-detect';
            }
        })();

        try { const w = async () => { await navigator.wakeLock.request("screen"); }; w(); } catch(e) {}
        (function hookNextWS() {
            if (window.__wsHookReady) return;
            window.__wsHookReady = true;
            const OrigWS = window.WebSocket;
            function PatchedWS(url, protocols) {
                const ws = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
                window.ws = ws;
                ws.addEventListener('message', function(ev) {
                    try {
                        const data = (ev && ev.data) || '';
                        if (typeof data !== 'string' || !window.__appendChat) return;
                        const s = data.trim();
                    
                        const isNumeric = /^\d{3}\s/.test(s);
                        if (s.indexOf('JOIN') === 0) { window.__appendChat('→ JOIN ' + s.substring(4)); return; }
                        if (s.indexOf('PART') === 0) { window.__appendChat('← PART ' + s.substring(4)); return; }
                        if (s.indexOf('PRIVMSG') !== -1) { window.__appendChat('← ' + s); return; }
                        if (s.indexOf('QUIT') === 0) { window.__appendChat('← QUIT ' + s.substring(4)); return; }
                        if (s.indexOf('NICK') === 0) { window.__appendChat('• NICK ' + s.substring(4)); return; }
                        if (s.indexOf('KICK') !== -1) { window.__appendChat('⚡ ' + s); return; }
                        if (!isNumeric && s.length > 0 && s.length < 500) {
                            window.__appendChat('← ' + s);
                        }
                    } catch(e) {}
                });
                return ws;
            }
            PatchedWS.prototype = OrigWS.prototype;
            PatchedWS.CONNECTING = 0; PatchedWS.OPEN = 1; PatchedWS.CLOSING = 2; PatchedWS.CLOSED = 3;
            window.WebSocket = PatchedWS;
        })();

        (function setupChat() {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('chatSend');
            const log = document.getElementById('chatLog');
            window.__appendChat = function(line) {
                if (!log) return;
                const ts = new Date().toTimeString().slice(0,8);
                log.value += '[' + ts + '] ' + line + '\n';
                log.scrollTop = log.scrollHeight;
                // Mantener máximo 200 líneas
                const lines = log.value.split('\n');
                if (lines.length > 200) log.value = lines.slice(-200).join('\n');
            };
            function send() {
                const msg = (input.value || '').trim();
                if (!msg) return;
       
                if (window.ws && window.ws.readyState === 1) {
          
                    try {
                        window.ws.send('PRIVMSG 0 0 :' + msg + '\r\n');
                        window.__appendChat('me → ' + msg);
                        input.value = '';
                    } catch(e) {
                        window.__appendChat('error sending: ' + e.message);
                    }
                } else {
                    window.__appendChat('not connected');
                }
            }
            if (btn) btn.addEventListener('click', send);
            if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
        })();

        (function setupMove() {
            const cb = document.getElementById('moves');
            const intervalInput = document.getElementById('moveInterval');
            const patternSel = document.getElementById('movePattern');
            const status = document.getElementById('moveStatus');
            let timer = null;
            let dir = 0;
            function tick() {
                try {
                    if (!window.ws || window.ws.readyState !== 1) return;
                    const pattern = (patternSel && patternSel.value) || 'leftright';
                    let action;
                    if (pattern === 'leftonly') action = 1;
                    else if (pattern === 'rightonly') action = 2;
                    else if (pattern === 'rightleft') { dir ^= 1; action = dir ? 1 : 2; }
                    else { dir ^= 1; action = dir ? 1 : 2; }
                    window.ws.send('ACTION ' + action + '\r\n');
                    if (status) status.textContent = 'moving → ACTION ' + action + (dir ? ' (right)' : ' (left)');
                    if (window.__appendChat) window.__appendChat('move: ACTION ' + action);
                } catch(e) {}
            }
            function start() {
                stop();
                const ms = Math.max(100, parseInt((intervalInput && intervalInput.value) || 800, 10));
                timer = setInterval(tick, ms);
                if (status) status.textContent = 'on — ' + ms + 'ms';
            }
            function stop() {
                if (timer) { clearInterval(timer); timer = null; }
                if (status) status.textContent = 'off';
            }
            if (cb) {
                cb.addEventListener('change', () => { cb.checked ? start() : stop(); });
            }
            if (intervalInput) {
                intervalInput.addEventListener('change', () => { if (cb && cb.checked) start(); });
            }
     
            if (cb && cb.checked) setTimeout(start, 500);
        })();
    </script>

        processNextAction();

          return;

        currentAction = actionQueue.shift();

          currentAction = null;
          processingAction = false;
          setTimeout(() => processNextAction(), 0);
          return;
        }

        processingAction = true;

        const enviado = aprisionar(currentAction.id, true);
        if (!enviado) {
          // Não perde o ID caso o socket mude de estado no instante do envio.
          if (activeCycleKeys.has(currentAction.key) && !queuedActionKeys.has(currentAction.key)) {

          return;
